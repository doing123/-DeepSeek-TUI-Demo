  <g>
    <text x="70" y="690" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="800" fill="#17211b">Current Capabilities</text>
    <text x="80" y="724" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#46534d"><tspan x="80" y="724">终端入口：npm run agent 可直接运行同一套 agent runner，不依赖本地 Next 服务。</tspan><tspan x="80" y="748">CLI 状态视图：终端展示 answer、plan、filesToInspect、patchProposal 摘要和可选 trace。</tspan><tspan x="80" y="772">CLI 运行历史：终端支持 --recent 和 --show 回看 .agent-runs 中的历史记录。</tspan><tspan x="80" y="796">服务端 API：POST /api/agent。</tspan><tspan x="760" y="724">只读工具循环：模型可通过严格 JSON 协议请求 list_files、read_file、search_text、git_status。</tspan><tspan x="760" y="748">Git 只读上下文：agent 可读取当前分支、短状态、diff stat 和最近提交。</tspan><tspan x="760" y="772">工具 trace：UI 展示每次工具调用的输入和输出摘要。</tspan><tspan x="760" y="796">补丁预览：模型 final answer 可附带结构化 patchProposal，由 UI 展示待写入文件。</tspan></text>
  </g>

  <text x="70" y="812" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#7a857f">Generated by scripts/generate-architecture-diagram.mjs. Commit the versioned SVG to compare architecture changes over time.</text>
