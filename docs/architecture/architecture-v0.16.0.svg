  <g>
    <text x="70" y="690" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="800" fill="#17211b">Current Capabilities</text>
    <text x="80" y="724" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#46534d"><tspan x="80" y="724">应用后验证：Web 可在应用补丁后自动运行 typecheck、build、all 或跳过。</tspan><tspan x="80" y="748">CLI 验证闭环：npm run agent -- --apply --validate 只在补丁成功应用后运行验证。</tspan><tspan x="80" y="772">TUI 验证入口：按 v 对最新运行执行 typecheck，并把结果写回 run history。</tspan><tspan x="80" y="796">验证触发来源：ValidationRunResult 记录 manual 或 post_patch，方便续接时理解验证语境。</tspan><tspan x="760" y="724">Patch diff：runner 在 final answer 包含 patchProposal 时生成服务端 diff 预览。</tspan><tspan x="760" y="748">写入风险视图：CLI、Web、TUI 展示补丁 additions/deletions、风险标签和 diff 片段。</tspan><tspan x="760" y="772">协议修复：AGENT_PROTOCOL_REPAIR_* 控制模型协议错误后的受控修复重试。</tspan><tspan x="760" y="796">上下文选择：AGENT_CONTEXT_SELECTED_MAX_FILES 控制初始 prompt 文件地图数量。</tspan></text>
  </g>

  <text x="70" y="812" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#7a857f">Generated by scripts/generate-architecture-diagram.mjs. Commit the versioned SVG to compare architecture changes over time.</text>
