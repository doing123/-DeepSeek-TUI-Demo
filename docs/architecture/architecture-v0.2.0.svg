    <text x="80" y="724" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#46534d"><tspan x="80" dy="24">Next.js + TypeScript 项目骨架。</tspan><tspan x="80" dy="24">浏览器工作台：输入目标、运行 agent、查看步骤摘要和建议。</tspan><tspan x="80" dy="24">服务端 API：POST /api/agent。</tspan><tspan x="80" dy="24">DeepSeek provider：读取 DEEPSEEK_API_KEY、DEEPSEEK_BASE_URL、DEEPSEEK_MODEL。</tspan><tspan x="80" dy="24">离线模式：没有 API key 时仍能返回本地规划结果。</tspan><tspan x="80" dy="24">工作区索引：忽略 .git、node_modules、.next 和真实 .env 文件，只暴露文本文件路径。</tspan><tspan x="80" dy="24">只读工具循环：模型可通过严格 JSON 协议请求 list_files、read_file、search_text。</tspan></text>
  </g>

