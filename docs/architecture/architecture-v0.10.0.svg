  <g>
    <text x="70" y="690" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="800" fill="#17211b">Current Capabilities</text>
    <text x="80" y="724" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#46534d"><tspan x="80" y="724">终端入口：npm run agent 可直接运行同一套 agent runner，不依赖本地 Next 服务。</tspan><tspan x="80" y="748">TUI 入口：npm run tui 打开全屏终端界面，展示目标、最近运行、实时事件和模型流片段。</tspan><tspan x="80" y="772">CLI 状态视图：终端展示 answer、plan、filesToInspect、patchProposal 摘要和可选 trace。</tspan><tspan x="80" y="796">CLI 流式 trace：npm run agent -- --stream 可在 agent 执行时打印事件并启用 DeepSeek token streaming。</tspan><tspan x="760" y="724">CLI 运行历史：终端支持 --recent 和 --show 回看 .agent-runs 中的历史记录。</tspan><tspan x="760" y="748">终端补丁审批：npm run agent -- --apply 会要求用户确认后复用安全 patch apply 模块写入文件。</tspan><tspan x="760" y="772">验证命令串联：npm run agent -- --validate typecheck|build|all 可在终端运行白名单验证命令。</tspan><tspan x="760" y="796">CLI 恢复上下文：npm run agent -- --continue &lt;run-id&gt; 可把历史 run 压缩成本轮上下文。</tspan></text>
  </g>

  <text x="70" y="812" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#7a857f">Generated by scripts/generate-architecture-diagram.mjs. Commit the versioned SVG to compare architecture changes over time.</text>
</svg>
